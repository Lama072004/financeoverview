name: financeoverview
description: "Finanzübersicht – private, offline Vermögensübersicht für iOS und Android."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.9.2

dependencies:
  cryptography: ^2.9.0
  file_picker: ^11.0.3
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  flutter_timezone: ^5.1.1
  http: ^1.6.0
  # Used by pdf. image 4.11 needs a newer archive than Dart 3.9 can resolve.
  image: ">=4.5.0 <4.11.0"
  intl: ^0.20.2
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
